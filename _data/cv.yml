  summary: >
    Undergraduate researcher focused on multimodal LLM evaluation, reasoning benchmarks,
    and AI agents. Incoming Research Intern on the AMD AGI team working on LLM inference,
    Research Fellow at IIT Bhubaneswar (with Dr. Shreya Ghosh), and IUSSTF-Viterbi
    Summer Research Intern at USC. CS junior at KIIT University (GPA 9.74/10).
    Published at ICCV 2025, IJCNLP-AACL 2025, and EMNLP 2026 Findings.

