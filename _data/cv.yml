        location: Bengaluru, India
        start_date: "2026-05-01"
        end_date: "2026-08-01"
        summary: "Advisor: Dr. Maja Mataric"
        highlights:
          - "Built LazySloth, a fast video understanding method that improved retrieval efficiency by up to 8.3x over existing pipelines such as VideoLucy and WorldMM, while retaining task accuracy."
          - "Contributed to lab infrastructure on LLM inference. (Submitted to AAAI 2027)"

      - company: Carnegie Mellon University
        position: Research Intern
        location: Remote
        start_date: "2026-01-01"
        end_date: "2026-05-01"
        summary: "Advisor: Dr. Min Xu"
        highlights:
          - "Applied GRPO, DPO, and PPO to study RL generalization to codon translation, a low-sampling decoding task (64-token action space)."
          - "Improved VRAM efficiency of the code to iterate GRPO on 800k+ datapoints."

      - company: IIT Bhubaneswar
        position: Undergraduate Research Fellow (Funded)
        location: Bengaluru, India
        start_date: "2024-12-01"
        end_date: ""
        summary: "Advisor: Dr. Shreya Ghosh"
        highlights:
          - "Developed mmJEE-Eval, a 1,460-problem multimodal STEM reasoning benchmark evaluating 17 VLMs. Discovered metacognitive barriers: VLMs detect 53% of errors but correct only 3.5%. (IJCNLP-AACL 2025 Findings)"
          - "Created the first evaluation framework for VLM cultural competence via multimodal story generation on 5 VLMs. (Oral @ ICCV 2025 ASI Workshop)"
          - "Proposed ICE, a new evaluation paradigm unlike benchmarks and leaderboards that models real-world tasks."
          - "Engineered CoTDL-mini-SWE-agent, a novel coding harness to improve frontier agentic terminal coding performance. (Submitted to NeurIPS 2026)"

      - company: IIT Ropar
        position: Summer Research Fellow (IASc-INSA-NASI)
        location: Ropar, India
        start_date: "2025-05-01"
        end_date: "2025-07-01"
        summary: "Advisor: Dr. Sudarshan Iyengar"
        highlights:
          - "Developed EduVLM-Bench for STEM prerequisite detection and evaluated 5 open-source LLMs. Top model (Gemma3 27B) achieved 38.5% accuracy."

